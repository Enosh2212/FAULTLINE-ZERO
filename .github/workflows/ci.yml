name: faultline-zero-ci
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile all Python modules
        run: python -m compileall -q src tests scripts
      - name: Run tests
        run: python -m pytest -q
  graph-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start actual FalkorDB + API
        run: docker compose up --build -d
      - name: Smoke-test the graph and runner
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8000/api/v1/health/ready; then break; fi
            sleep 5
          done
          python scripts/smoke_test.py
      - name: Diagnostics
        if: failure()
        run: docker compose logs --tail=150
      - name: Tear down
        if: always()
        run: docker compose down -v
