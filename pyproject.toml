[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline-zero"
version = "0.2.0"
description = "Evidence-first graph-native regression investigation agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2,<3",
  "FalkorDB>=1.0,<3",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "sqlalchemy>=2.0,<3",
  "pyjwt[crypto]>=2.8,<3",
  "cryptography>=42.0,<51",
  "firebase-admin>=6.5,<8"
]

[project.optional-dependencies]
auth = ["firebase-admin>=6.5,<8"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faultline = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

