services:
  graph:
    image: falkordb/falkordb-server:latest
    restart: unless-stopped
    expose:
      - "6379"
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    volumes:
      - graph_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
  api:
    build:
      context: .
      args:
        FZ_PYTHON_EXTRAS: "${FZ_PYTHON_EXTRAS:-}"
    restart: unless-stopped
    environment:
      FZ_GRAPH_HOST: graph
      FZ_GRAPH_PORT: "6379"
      FZ_AUTO_SEED: "${FZ_AUTO_SEED:-true}"
      FZ_ENV: "${FZ_ENV:-development}"
      FZ_ALLOWED_ORIGINS: "${FZ_ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:8001,http://127.0.0.1:8001}"
      FZ_API_KEY: "${FZ_API_KEY:-}"
      FZ_RUNNER_TIMEOUT: "${FZ_RUNNER_TIMEOUT:-8}"
      FZ_LLM_API_KEY: "${FZ_LLM_API_KEY:-}"
      FZ_LLM_BASE_URL: "${FZ_LLM_BASE_URL:-}"
      FZ_LLM_MODEL: "${FZ_LLM_MODEL:-}"
      FZ_DATABASE_URL: "${FZ_DATABASE_URL:-sqlite:////app/data/faultline_zero.db}"
      FZ_FIREBASE_PROJECT_ID: "${FZ_FIREBASE_PROJECT_ID:-}"
      FZ_FIREBASE_CREDENTIALS_PATH: "${FZ_FIREBASE_CREDENTIALS_PATH:-}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-}"
      FZ_FIREBASE_WEB_API_KEY: "${FZ_FIREBASE_WEB_API_KEY:-}"
      FZ_FIREBASE_AUTH_DOMAIN: "${FZ_FIREBASE_AUTH_DOMAIN:-}"
      FZ_FIREBASE_WEB_APP_ID: "${FZ_FIREBASE_WEB_APP_ID:-}"
      FZ_FIREBASE_GITHUB_ENABLED: "${FZ_FIREBASE_GITHUB_ENABLED:-true}"
      FZ_FIREBASE_GOOGLE_ENABLED: "${FZ_FIREBASE_GOOGLE_ENABLED:-true}"
      FZ_AUTH_MOCK_ENABLED: "${FZ_AUTH_MOCK_ENABLED:-false}"
      FZ_SESSION_COOKIE_SECURE: "${FZ_SESSION_COOKIE_SECURE:-false}"
      FZ_SESSION_SECRET_KEY: "${FZ_SESSION_SECRET_KEY:-faultline-zero-dev-secret-key-change-in-prod-32b}"
      FZ_GITHUB_APP_ID: "${FZ_GITHUB_APP_ID:-}"
      FZ_GITHUB_APP_PRIVATE_KEY_PATH: "${FZ_GITHUB_APP_PRIVATE_KEY_PATH:-}"
      FZ_GITHUB_WEBHOOK_SECRET: "${FZ_GITHUB_WEBHOOK_SECRET:-dev-webhook-secret}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      graph:
        condition: service_healthy
    volumes:
      - auth_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
volumes:
  graph_data:
  auth_data:
